<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kuro Gym</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Atkinson+Hyperlegible:wght@400;700&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: sticky top bar + week strip, Kuro hero, then a "stage" card (animated pose + prescription) above the day's list. Sticker look borrowed from Kuro's own outline. */
:root{
  --bg:#F2EFF6; --surface:#FFFFFF; --surface-2:#E9E4F0; --ink:#2E1528; --muted:#6E5F72; --line:#D6CEDF;
  --coral:#F25F5C; --sun:#FDC765; --slate:#6C6A92; --plum:#3A1530; --good:#2E9B6A;
  --accent:var(--coral); --accent-ink:#FFFFFF;
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --stage-bg:#FFF6E3; --shadow:var(--plum);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1020; --surface:#28192C; --surface-2:#332237; --ink:#F7EEF4; --muted:#BBA8BF; --line:#46324A;
  --coral:#FF7A73; --sun:#FDC765; --slate:#9C99C6; --plum:#3A1530; --good:#5CCB98;
  --accent-ink:#1B1020; --stage-bg:#33213A; --shadow:#0C060E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1020; --surface:#28192C; --surface-2:#332237; --ink:#F7EEF4; --muted:#BBA8BF; --line:#46324A;
  --coral:#FF7A73; --sun:#FDC765; --slate:#9C99C6; --plum:#3A1530; --good:#5CCB98;
  --accent-ink:#1B1020; --stage-bg:#33213A; --shadow:#0C060E; color-scheme:dark}
body.ella{--accent:var(--slate)}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:40px;height:40px;object-fit:contain}
.brand b{font-family:var(--f-display);font-size:26px;font-weight:400;letter-spacing:.02em}
.brand b span{color:var(--coral)}
.who{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:4px}
.who button{border:0;background:transparent;border-radius:999px;padding:7px 16px;font-weight:700;color:var(--muted)}
.who button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 4px;text-align:center;display:flex;flex-direction:column;gap:1px;min-width:0}
.day .d{font-family:var(--f-display);font-size:17px}
.day .s{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day.today .d::after{content:"•";color:var(--coral);margin-left:3px}
.day[aria-pressed="true"]{border-color:var(--plum);background:var(--sun);color:#2E1528;box-shadow:3px 3px 0 var(--shadow)}
.day[aria-pressed="true"] .s{color:#5A3A4F}
.day.rest .d{opacity:.7}

/* hero */
.hero{display:grid;grid-template-columns:180px minmax(0,1fr);gap:20px;align-items:center;padding-top:6px}
.hero .kuro{width:180px;max-width:100%;filter:drop-shadow(0 6px 0 rgba(0,0,0,.06))}
@media (prefers-reduced-motion:no-preference){.hero .kuro{animation:bob 2.6s ease-in-out infinite}}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1deg)}}
.hero-txt{display:flex;flex-direction:column;gap:10px;min-width:0}
.hero h1{font-size:clamp(34px,6vw,54px)}
.hero h1 small{display:block;font-family:var(--f-body);font-weight:700;font-size:16px;color:var(--muted);letter-spacing:0;margin-top:6px}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px}
.fact b{font-family:var(--f-mono);font-weight:500}
.bubble{position:relative;background:var(--surface);border:2px solid var(--plum);border-radius:16px;padding:10px 14px;max-width:62ch;box-shadow:3px 3px 0 var(--shadow)}
:root[data-theme="dark"] .bubble{border-color:var(--line)}
.bubble b{color:var(--coral)}
.progress{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.progress .track{flex:1;height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;max-width:320px}
.progress .fill{height:100%;background:var(--good);width:0;transition:width .4s}

/* warm-up */
.strip{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.strip .tag{font-family:var(--f-display);font-size:15px;background:var(--surface-2);border-radius:8px;padding:2px 10px;white-space:nowrap}
.strip p{margin:0;min-width:0}

/* stage */
.stage{background:var(--surface);border:2.5px solid var(--plum);border-radius:22px;box-shadow:6px 6px 0 var(--shadow);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);overflow:hidden}
:root[data-theme="dark"] .stage{border-color:#120914}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stage{border-color:#120914}}
.screen{background:var(--stage-bg);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;border-right:2.5px dashed var(--line);min-width:0}
.screen svg.fig{width:100%;max-width:420px;aspect-ratio:220/200;height:auto;display:block}
.phase{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}
.phase .lbl{font-family:var(--f-display);font-size:20px;min-width:9ch;text-align:center}
.phase button{border:2px solid var(--plum);background:var(--sun);color:#2E1528;border-radius:999px;padding:4px 14px;font-weight:700}
.ss-badge{position:absolute;top:12px;left:12px;background:var(--plum);color:#FDC765;font-family:var(--f-display);font-size:14px;padding:3px 10px;border-radius:8px}
.counter{position:absolute;top:12px;right:14px;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.info{padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.info h2{font-size:clamp(26px,3.4vw,34px)}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chip{background:var(--surface-2);border-radius:12px;padding:8px 12px;min-width:0}
.chip .k{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.chip .v{font-family:var(--f-mono);font-size:16px}
.chip.wide{grid-column:1/-1}
.chip .v.txt{font-family:var(--f-body);font-weight:700;font-size:15px}
.tech{margin:0;color:var(--ink)}
.poses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pose{border:2px solid var(--line);background:var(--stage-bg);border-radius:12px;padding:4px 4px 8px;display:flex;flex-direction:column;gap:2px;text-align:left}
.pose svg{width:100%;height:auto;aspect-ratio:220/200;display:block}
.pose .n{font-family:var(--f-display);font-size:14px;padding:0 6px;display:flex;gap:6px;align-items:center}
.pose .n i{font-style:normal;background:var(--plum);color:#FDC765;border-radius:50%;width:20px;height:20px;display:inline-grid;place-items:center;font-size:12px;flex:none}
.pose .c{font-size:12.5px;line-height:1.3;padding:0 6px;color:var(--muted)}
.pose.on{border-color:var(--coral);box-shadow:0 0 0 2px var(--coral) inset}
.sets{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:8px}
.dot{width:38px;height:38px;border-radius:50%;border:2.5px solid var(--plum);background:var(--surface);font-family:var(--f-display);font-size:16px;display:grid;place-items:center;color:var(--ink)}
:root[data-theme="dark"] .dot{border-color:var(--muted)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dot{border-color:var(--muted)}}
.dot[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.wt{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.wt input{width:78px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 8px;font-family:var(--f-mono);font-size:15px}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:auto}
.nav button{flex:1;border:2px solid var(--plum);border-radius:12px;padding:10px;font-weight:700;background:var(--surface)}
.nav button.next{background:var(--coral);color:#fff;border-color:var(--plum)}
.nav button:disabled{opacity:.35;cursor:default}

/* list */
.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
.list{display:flex;flex-direction:column;gap:8px}
.list h3,.side h3{font-size:22px;margin-bottom:4px}
.grp{display:flex;flex-direction:column;gap:6px}
.grp.ss{border-left:4px solid var(--sun);padding-left:10px}
.grp.ss::before{content:attr(data-label);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.row .num{font-family:var(--f-display);font-size:16px;color:var(--muted)}
.row .nm{font-weight:700;min-width:0}
.row .nm small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.row .rx{font-family:var(--f-mono);font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.row.on{border-color:var(--coral);box-shadow:inset 4px 0 0 var(--coral)}
.row.done .num{color:var(--good)}
.row.done .num::after{content:" ✓"}
.side{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card p{margin:0}
.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.anchors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.anchors div{background:var(--surface-2);border-radius:12px;padding:8px;text-align:center}
.anchors b{display:block;font-family:var(--f-mono);font-size:18px}
.anchors span{font-size:12px;color:var(--muted)}

/* rest day / ella */
.restday{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.empty{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:center;background:var(--surface);border:2.5px solid var(--plum);box-shadow:6px 6px 0 var(--shadow);border-radius:22px;padding:24px}
.empty img{width:200px;max-width:100%}
.empty ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* timer */
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--plum);color:#fff;border-radius:999px;padding:8px 10px 8px 8px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.timer img{width:36px;height:36px;object-fit:contain;background:#FDC765;border-radius:50%;padding:2px}
.timer b{font-family:var(--f-mono);font-size:22px;color:#FDC765}
.timer button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:6px 12px;font-weight:700}

@media (max-width:820px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .screen{border-right:0;border-bottom:2.5px dashed var(--line)}
  .cols,.restday{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .hero{grid-template-columns:96px minmax(0,1fr);gap:12px}
  .hero .kuro{width:96px}
  .day .s{display:none}
  .day{padding:8px 2px}
  .empty{grid-template-columns:minmax(0,1fr);text-align:left}
  .empty img{width:120px}
  .info{padding:16px}
  .anchors b{font-size:15px}
}
</style>

/* ---------- Animación ---------- */
let raf=0,t0=0;
const ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
function poseAt(ex,u){return u<=.5?lerpP(full(ex,0),full(ex,1),u*2):lerpP(full(ex,1),full(ex,2),(u-.5)*2)}
function startAnim(){
 cancelAnimationFrame(raf);
 const it=PLAN[state.who][state.day].items[state.ex],P=POSES[it.pose],svg=$("#stage svg.fig"),lbl=$("#plbl");
 const [d1,h1,d2,h0]=P.tm,T=d1+h1+d2+h0;
 const mark=u=>document.querySelectorAll(".pose").forEach((b,i)=>b.classList.toggle("on",Math.round(u*2)===i));
 if(state.frame!=null||!state.playing){const fi=state.frame??0;svg.innerHTML=draw(it.pose,full(it.pose,fi));mark(fi/2);
  lbl.textContent=state.frame!=null?"Posición "+(fi+1):P.ph[0];return}
 t0=performance.now();
 const step=now=>{let t=((now-t0)/1000)%T,u,ph;
  if(t<d1){u=ease(t/d1);ph=0}else if(t<d1+h1){u=1;ph=1}else if(t<d1+h1+d2){u=1-ease((t-d1-h1)/d2);ph=2}else{u=0;ph=3}
  svg.innerHTML=draw(it.pose,poseAt(it.pose,u));
  if(lbl.textContent!==P.ph[ph])lbl.textContent=P.ph[ph];mark(u);
  raf=requestAnimationFrame(step)};
 raf=requestAnimationFrame(step);
}

 if(b.id==="play"){state.playing=!state.playing;state.frame=null;b.textContent=state.playing?"Pausa":"Animar";b.setAttribute("aria-pressed",state.playing);

 if(b.dataset.set!=null){const it=PLAN[state.who][state.day].items[state.ex],k=kSets(it.id),m=store.get(k,[]),i=+b.dataset.set;
